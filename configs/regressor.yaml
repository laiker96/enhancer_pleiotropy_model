# Regressor pretraining: `epm train-regressor --architecture cnn`
# The five manuscript regressors differ only in `architecture`.

data: data/regression
output: runs/regressors            # the model is written to <output>/<architecture>/best_model.pt
architecture: cnn                  # cnn | attention | dense | enhancernet_cnn | enhancernet_attention
seed: 20260829
device: cuda                       # cuda | cpu | auto

model:
  dropout: 0.1
  head_dropout: 0.1

training:
  epochs: 40
  batch_size: 64
  eval_batch_size: 64
  mixed_precision: fp16            # fp16 (GPU) | none
  max_learning_rate: 1.0e-4
  warmup_fraction: 0.025           # linear warm-up over 2.5% of all steps
  post_warmup_decay_epochs: 4      # then cosine decay to post_warmup_learning_rate
  post_warmup_learning_rate: 5.0e-5
  plateau_factor: 0.5              # then halve the rate when the validation score plateaus
  plateau_patience: 3
  plateau_threshold: 1.0e-4
  minimum_learning_rate: 1.0e-6
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  rc_probability: 0.5              # random reverse complement of training windows
  checkpoint_every_batches: 500    # restart checkpoint (last_checkpoint.pt)
  max_batches_per_epoch: null      # set small values for a quick smoke test
  max_validation_batches: null

loss:                              # AlphaGenome-style profile loss, per assay
  positional_weight: 5.0
  cross_context_weight: 5.0
  auxiliary_weight: 0.1
