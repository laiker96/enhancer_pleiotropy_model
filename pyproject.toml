[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enhancer-pleiotropy-model"
version = "1.0.0"
description = "Sequence models of Drosophila enhancer activity across eight developmental contexts"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ian Laiker" }, { name = "Frankel lab" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "pyBigWig>=0.3.22",
  "torch>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
epm = "enhancer_pleiotropy_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
