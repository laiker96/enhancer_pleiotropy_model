# mamba env create -f environment.yml && mamba activate epm
# Versions used for the manuscript models. PyTorch comes from the official
# CUDA 12.1 wheels; change the index URL for another CUDA version or CPU only
# (https://pytorch.org/get-started/previous-versions/).
name: epm
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy=2.2
  - pandas=2.2
  - scipy=1.15
  - pyyaml=6.0
  - pybigwig=0.3.24
  - pytest
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.5.1
      - -e .
