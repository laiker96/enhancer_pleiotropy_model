# Scientific settings of the 2048-bp 4x AG-loss transfer-learning parents.
# Input/output paths are filled by the portable launcher, not hand-edited here.
seed: 20260829
contexts: [ab, e13, e5, ead, hid, lb, o, wid]
split_strategy: regions
chromosome_splits:
  train: [chrX, chr2R, chr3L, chr4, chrUn_CP007081v1, chrUn_CP007120v1, chrY]
  validation: []
  test: [chr3R]
region_splits:
  train: ['chr2L:11761856-23513712']
  validation: ['chr2L:0-11751856']
  test: []
sampling:
  central_target_bp: 512
  context_flank_bp: 768
  training_stride_bp: 128
  validation_stride_bp: 256
  background_to_peak_ratio: 1.0
  block_size_bp: 1000000
profiles:
  atac_target_bp: 512
  h3k27ac_target_bp: 1536
  source_bin_bp: 16
  h3k27ac_output_pool_size: 4
model: {preset: 4x, dropout: 0.1, head_dropout: 0.1}
specificity_finetuning: {enabled: false}
training:
  device: cuda
  epochs: 40
  batch_size: 64
  evaluation_batch_size: 64
  mixed_precision: fp16
  num_workers: 0
  max_learning_rate: 0.0001
  minimum_learning_rate: 0.000001
  warmup_fraction: 0.025
  post_warmup_decay_epochs: 4
  post_warmup_learning_rate: 0.00005
  plateau_factor: 0.5
  plateau_patience: 3
  plateau_threshold: 0.0001
  patience: 40
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  stochastic_rc_probability: 0.5
  validation_rc_ensemble: true
  checkpoint_every_batches: 500
  loss:
    name: alphagenome_profile_cross_context
    positional_weight: 5.0
    cross_context_weight: 5.0
    auxiliary_weight: 0.1
